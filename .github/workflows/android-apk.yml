name: MAROS Mobile V3 APK

on:
  push:
    branches:
      - build/maros-mobile-v3
    paths:
      - "MAROS-MOBILE-V3.android.tar.gz.b64"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          base64 -d MAROS-MOBILE-V3.android.tar.gz.b64 | tar -xz
          test -f android/MarosMobile/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/MarosMobile assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/MarosMobile/app/build/outputs/apk/debug/app-debug.apk MAROS-Mobile-V3-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAROS-Mobile-V3-APK
          path: MAROS-Mobile-V3-debug.apk
          if-no-files-found: error
          retention-days: 30

# V3 build pipeline
