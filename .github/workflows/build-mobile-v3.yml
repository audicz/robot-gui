name: MAROS Mobile Cockpit V3
on:
  push:
    branches: [main, feature/maros-mobile-cockpit-v1-fresh]
    paths:
      - 'MAROS-MOBILE-COCKPIT-V3/**'
      - '.github/workflows/build-mobile-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p MAROS-MOBILE-COCKPIT-V3 assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAROS-Mobile-Cockpit-V3-debug
          path: MAROS-MOBILE-COCKPIT-V3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
