name: MAROS Mobile Cockpit V3 APK
on:
  push:
    branches: [main, feature/maros-mobile-cockpit-v1-fresh]
    paths:
      - 'MAROS-MOBILE-COCKPIT-V3/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V3 debug APK
        run: gradle -p MAROS-MOBILE-COCKPIT-V3 assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAROS-Mobile-Cockpit-V3-debug
          path: MAROS-MOBILE-COCKPIT-V3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
