name: Rebuild MAROS Mobile Cockpit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MAROS-MOBILE-COCKPIT-V1.zip.b64'
      - '.github/workflows/rebuild-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and inspect embedded source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d MAROS-MOBILE-COCKPIT-V1.zip.b64 > /tmp/mobile-cockpit.zip
          unzip -t /tmp/mobile-cockpit.zip
          mkdir -p source
          unzip -q /tmp/mobile-cockpit.zip -d source
          echo "=== SOURCE FILES ==="
          find source -maxdepth 5 -type f | sort | head -300
          ROOT="$(find source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "::error::Gradle settings file not found in source archive"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Gradle project root: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"
            "$PROJECT_ROOT/gradlew" -p "$PROJECT_ROOT" assembleDebug --stacktrace
          else
            gradle -p "$PROJECT_ROOT" assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAROS-MOBILE-COCKPIT-rebuilt-debug
          path: |
            source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload extracted Android source
        uses: actions/upload-artifact@v4
        with:
          name: MAROS-MOBILE-COCKPIT-source
          path: source/
          if-no-files-found: error
          retention-days: 30
